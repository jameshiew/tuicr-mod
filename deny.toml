[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
unmaintained = "none"

[bans]
multiple-versions = "allow"
wildcards = "warn"
allow-wildcard-paths = true

[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tree-sitter-grammars/tree-sitter-scss"]
