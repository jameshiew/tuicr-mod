# Repo-owned local theme example for tuicr.
# Flat key/value schema is intentional: local themes use the same top-level keys
# that tuicr validates at load time, so the file stays easy to copy and edit.
panel_bg = "#062832"
bg_highlight = "#12435f"
fg_primary = "#d7e7ff"
fg_secondary = "#9eb8d4"
fg_dim = "#617c99"

diff_add = "#39d0b3"
diff_add_bg = "#123f3d"
diff_del = "#ff6b8a"
diff_del_bg = "#4a2434"
diff_context = "#d7e7ff"
diff_hunk_header = "#79b8ff"
expanded_context_fg = "#617c99"

syntax_add_bg = "#123f3d"
syntax_del_bg = "#4a2434"

# Optional syntax colors. Every key below may be omitted; an unset role keeps
# the colour from the built-in palette that suits `panel_bg`.
syntax_text = "#ddfff4"
syntax_comment = "#6a9a8b"
syntax_keyword = "#2dd4bf"
syntax_string = "#a3e635"
syntax_number = "#f2c36b"
syntax_constant = "#f2c36b"
syntax_function = "#7dd3fc"
syntax_type = "#7dd3fc"
syntax_variable = "#a6d9ca"
syntax_property = "#a6d9ca"
syntax_operator = "#4ee3ff"
syntax_punctuation = "#9eb8d4"
syntax_attribute = "#f2c36b"
syntax_tag = "#2dd4bf"
syntax_namespace = "#7dd3fc"
syntax_escape = "#4ee3ff"
syntax_error = "#ff6b8a"

file_added = "#39d0b3"
file_modified = "#f2c36b"
file_deleted = "#ff6b8a"
file_renamed = "#b18cff"

reviewed = "#39d0b3"
pending = "#f2c36b"

comment_note = "#79b8ff"
comment_suggestion = "#4ee3ff"
comment_issue = "#ff6b8a"
comment_praise = "#55d68b"

border_focused = "#4ee3ff"
border_unfocused = "#23415f"
status_bar_bg = "#0b2d3f"
cursor_color = "#f2c36b"
cursor_line_bg = "#0d3248"
branch_name = "#b18cff"
help_indicator = "#7a96b3"

message_info_fg = "#061827"
message_info_bg = "#79b8ff"
message_warning_fg = "#061827"
message_warning_bg = "#f2c36b"
message_error_fg = "#061827"
message_error_bg = "#ff6b8a"

mode_fg = "#061827"
mode_bg = "#4ee3ff"
