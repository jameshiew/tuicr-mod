[package]
name = "tuicr"
version = "0.25.0+mod"
edition = "2024"
license = "MIT"
repository = "https://github.com/jameshiew/tuicr-mod"
homepage = "https://github.com/jameshiew/tuicr-mod"
readme = "README.md"
keywords = ["tui", "git", "code-review", "diff", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# TUI framework
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which we use to
# measure each line's word-wrapped height with ratatui's own wrapping engine so
# per-row diff backgrounds/overlays align exactly with the rendered text.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Vim-style modal editing engine for the review comment box (opt-in via
# `comment_vim`). Used as the editing model + input engine only; we keep our
# own rendering, so its widget/clipboard/syntax features are disabled.
edtui = { version = "0.11", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI parsing
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
uuid = { version = "1.0", features = ["v4"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }
base64 = "0.22"
ignore = "0.4"
# User-supplied include/exclude patterns for the file tree filter.
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
shlex = "1.3"
tempfile = "3.24"

# Terminal background detection
terminal-colorsaurus = "1"

# Syntax highlighting
#
# `pulldown-cmark` parses review-comment bodies as Markdown; the code itself
# goes through tree-sitter. See `src/syntax` for how the two fit together.
pulldown-cmark = { version = "0.13", default-features = false }
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"

# Bundled grammars. Each compiles a C parser, which is the bulk of a cold
# build, so a language earns its place by turning up in review. Left out on
# purpose: `tree-sitter-perl` and `tree-sitter-clojure` pin older
# `tree-sitter` versions and the native library allows only one; `tree-sitter-
# graphql`, `-groovy`, `-hcl` and `-kotlin-ng` ship no highlight query, so
# `src/syntax/queries` supplies one; `tree-sitter-solidity` and
# `tree-sitter-latex` ship queries that no longer compile; and
# `tree-sitter-gitcommit` is WTFPL, which `deny.toml` does not allow (tuicr
# renders commit messages unhighlighted anyway).
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.4"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-diff = "0.1.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-elm = "5.9.4"
tree-sitter-embedded-template = "0.25.0"
tree-sitter-erlang = "0.20.0"
tree-sitter-fish = "3.6.0"
tree-sitter-glsl = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.2.1"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-heex = "0.8.1"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-jsonnet = "0.0.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = { version = "0.5.3", default-features = false }
tree-sitter-nix = "0.3.0"
tree-sitter-ocaml = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.3.0"
tree-sitter-regex = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-scss = "1.0.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-vim = "0.4.0"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

# Git operations
[target.'cfg(not(target_env = "musl"))'.dependencies]
git2 = { version = "0.21", default-features = false }

# Static Linux builds need a target-native zlib instead of the host library.
[target.'cfg(target_env = "musl")'.dependencies]
git2 = { version = "0.21", default-features = false, features = ["zlib-ng-compat"] }
